name: Deploy

# Started by hand from the Actions tab. Staging can be deployed from any
# branch, to try a change before it merges. Production deploys from main only
# and waits for approval on the "production" environment.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: Deploy to ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    steps:
      - name: Production deploys from main only
        if: inputs.target == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production is deployed from main. Start this workflow on the main branch."
          exit 1

      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A manual deploy runs the same checks as CI, so nothing unchecked ships.
      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Deploy
        run: |
          case "$TARGET" in
            staging) pnpm run deploy:staging ;;
            production) pnpm run deploy ;;
            *) echo "::error::Unknown target"; exit 1 ;;
          esac
        env:
          TARGET: ${{ inputs.target }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_HOSTNAME: ${{ secrets.APP_HOSTNAME }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          # Optional environment variable; unset means yes.
          AUTH_AUTO_ENROLL: ${{ vars.AUTH_AUTO_ENROLL }}
          # Optional environment variables; unset means the defaults.
          AI_PROFILE: ${{ vars.AI_PROFILE }}
          AI_GATEWAY: ${{ vars.AI_GATEWAY }}
          AI_LOG_CONTENT: ${{ vars.AI_LOG_CONTENT }}
          AI_DAILY_IMPORTS: ${{ vars.AI_DAILY_IMPORTS }}
          AI_COMPARE: ${{ vars.AI_COMPARE }}
          REQUIRE_HOSTNAME: "true"
