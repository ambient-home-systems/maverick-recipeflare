name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request replaces the run in progress. Runs on main are
# never cancelled, because they deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # A change to the Drizzle schema must come with its migration.
      - name: Check that the schema and the migrations agree
        run: pnpm db:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Bundles the Worker for both configurations without contacting
      # Cloudflare, so a broken wrangler.jsonc fails here and not in a deploy.
      - name: Check the production bundle
        run: node scripts/deploy.mjs --dry-run

      - name: Check the staging bundle
        run: node scripts/deploy.mjs --env staging --dry-run

      - name: Install the browser for the end-to-end run
        run: pnpm exec playwright install --with-deps chromium

      # The built app, served by a local Worker with an empty database and
      # driven in a phone-sized browser: the main path with the network taken
      # away part-way, an accessibility check of each screen, and a load-time guard.
      - name: End-to-end run
        run: pnpm e2e

      - name: Keep what the end-to-end run saw when it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: end-to-end
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-staging:
    name: Deploy to staging
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        run: pnpm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_HOSTNAME: ${{ secrets.APP_HOSTNAME }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          # Optional environment variable; unset means yes.
          AUTH_AUTO_ENROLL: ${{ vars.AUTH_AUTO_ENROLL }}
          # Optional environment variables; unset means the defaults.
          AI_PROFILE: ${{ vars.AI_PROFILE }}
          AI_GATEWAY: ${{ vars.AI_GATEWAY }}
          AI_LOG_CONTENT: ${{ vars.AI_LOG_CONTENT }}
          REQUIRE_HOSTNAME: "true"
